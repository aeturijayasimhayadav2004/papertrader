# Daily paper-trading run. PAPER ONLY - no broker, no real money.
# Runs after the NSE close on weekdays. Safe to re-run: processed days are skipped.
name: daily-paper-trade

on:
  schedule:
    # 14:30 UTC = 20:00 IST, Mon-Fri. The always-on server runs the same job at 16:45 IST;
    # this is the backup (idempotent: a day already processed is skipped).
    - cron: "30 14 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Recompute the latest trading day"
        type: boolean
        default: false

concurrency:
  group: daily-paper-trade
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Tests (no trading if the code is broken)
        run: python -m pytest -q

      # Local SQLite + price cache from the previous run (fallback if Supabase is down).
      - name: Restore local state
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: papertrader-data-${{ github.run_id }}
          restore-keys: papertrader-data-

      - name: Run bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PAPERTRADER_REQUIRE_SUPABASE: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional LLM brain (veto only): Groq free tier, or Claude. Unset = brain skipped.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Repo Settings -> Variables -> PAPERTRADER_KILL_SWITCH = 1 stops new buys without a code change.
          PAPERTRADER_KILL_SWITCH: ${{ vars.PAPERTRADER_KILL_SWITCH }}
        run: python scripts/run_daily.py ${{ inputs.force && '--force' || '' }}

      # Learn from results: what each brief / scan setup did afterwards, plus history scorecards.
      # Information only (never changes settings); a failure here never fails the run.
      - name: Learn from results
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/learn.py --write-db

      - name: Save local state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: papertrader-data-${{ github.run_id }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 30
          if-no-files-found: ignore
